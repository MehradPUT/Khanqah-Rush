<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    background: #2c3e50;
    margin: 0;
    overflow: hidden;
    font-family: Impact, 'Arial Black', sans-serif, Charter;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .preview-box {
    position: relative;
    width: 430px;
    height: 860px;
    background-color: #dcf2fd;
    overflow: hidden;
    border: 2px solid #555;
  }
  
  /* ARCADE FLOATING COMBAT TEXT */
  @keyframes arcadeFloat {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3) rotate(var(--rot, -5deg));
    }
    18% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.25) rotate(var(--rot, -5deg));
    }
    35% {
      transform: translate(-50%, -50%) scale(1.0) rotate(var(--rot, -5deg));
    }
    75% {
      opacity: 1;
      transform: translate(-50%, calc(-50% - 35px)) scale(1.05) rotate(var(--rot, -5deg));
    }
    100% {
      opacity: 0;
      transform: translate(-50%, calc(-50% - 65px)) scale(0.9) rotate(var(--rot, -5deg));
    }
  }

  .arcade-combat-text {
    position: absolute;
    pointer-events: none;
    z-index: 9999;
    font-family: Impact, 'Arial Black', 'Segoe UI', Tahoma, sans-serif;
    font-size: 34px;
    font-weight: 900;
    text-align: center;
    white-space: nowrap;
    direction: rtl;
    animation: arcadeFloat 0.9s cubic-bezier(0.15, 0.9, 0.25, 1.2) forwards;
    letter-spacing: 1px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
    -webkit-text-stroke: 2.5px #000;
    color: #FFD700;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFE082 30%, #FFB300 70%, #FF6F00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .arcade-combat-text.young {
    font-size: 38px;
    filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.9)) drop-shadow(0 4px 8px #000);
    -webkit-text-stroke: 2.5px #001f3f;
    background: linear-gradient(180deg, #FFFFFF 0%, #80D8FF 35%, #00E5FF 70%, #0091EA 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .arcade-combat-text.crit {
    font-size: 42px;
    filter: drop-shadow(0 0 20px rgba(255, 42, 0, 1)) drop-shadow(0 5px 12px #000);
    -webkit-text-stroke: 3px #3e0000;
    background: linear-gradient(180deg, #FFFFFF 0%, #FF8A80 30%, #FF1744 70%, #D50000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ARCADE ABILITY HUD */
  .arcade-hud-badge {
    position: absolute;
    top: 45px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 18px;
    border-radius: 20px;
    font-family: 'Arial Black', Impact, sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    z-index: 1000;
    pointer-events: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .arcade-hud-badge.old {
    background: linear-gradient(135deg, rgba(20, 24, 35, 0.9) 0%, rgba(35, 40, 55, 0.9) 100%);
    color: #FFE082;
    border: 2px solid #FFA000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.3);
  }

  @keyframes pulseFrenzy {
    0%, 100% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 15px rgba(255,145,0,0.9)); }
    50% { transform: translateX(-50%) scale(1.08); filter: drop-shadow(0 0 25px rgba(0,229,255,1)); }
  }

  .arcade-hud-badge.young {
    background: linear-gradient(90deg, #FF1744, #FF9100, #00E5FF, #D500F9);
    background-size: 300% 100%;
    animation: pulseFrenzy 0.8s infinite ease-in-out;
    color: #FFF;
    border: 2px solid #FFFFFF;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="preview-box" id="box">
    <div class="arcade-hud-badge young">⚡ JAVANI FRENZY: 4.8s — TIRED: NO! ⚡</div>
    <!-- Sample floating texts -->
    <div class="arcade-combat-text" style="top: 520px; left: 160px; --rot: -6deg;">یا حق! ⚡</div>
    <div class="arcade-combat-text young" style="top: 440px; left: 270px; --rot: 7deg;">طوفان اومد! 🔥</div>
    <div class="arcade-combat-text crit" style="top: 360px; left: 200px; --rot: -3deg;">💥 بشکن! 💥</div>
  </div>
</body>
</html>
